# wrangler-dispatcher.toml — rss-dispatcher relay Worker
# =======================================================
# A tiny Worker that lets telegram-rss-bot's cron trigger reach its own
# /internal/check endpoint. A Worker cannot fetch its own URL (Cloudflare
# error 1042), so the main Worker's cron POSTs here and this Worker relays
# the request back with the full (non-cron) CPU budget.
#
# Deploy with:
#   wrangler deploy --config wrangler-dispatcher.toml
#
# Required secret (set BEFORE deploying):
#   wrangler secret put INTERNAL_POLL_SECRET --config wrangler-dispatcher.toml
#   (must match the INTERNAL_POLL_SECRET on telegram-rss-bot)
#
# Vars:
#   TARGET_URL -> the main Worker's public URL (plain text, below)

name = "rss-dispatcher"
main = "src/dispatcher.ts"
compatibility_date = "2024-11-01"
# REQUIRED: lets this Worker fetch telegram-rss-bot on the same workers.dev
# zone. Without it Cloudflare rejects the relay with error 1042.
compatibility_flags = ["global_fetch_strictly_public"]

[vars]
TARGET_URL = "https://telegram-rss-bot.reyhaneh-fc0.workers.dev"
