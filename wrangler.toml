# wrangler.toml — Telegram RSS Feed Reader Bot
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "telegram-rss-bot"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# ---------------------------------------------------------------------------
# No cron trigger: polling is scheduled by the Telethon userbot trigger
# (userbot/trigger.py), which sends /check to the bot. The Telegram Serverless
# /check handler loads SQLite state, calls this Worker's /api/poll, and writes
# the returned seen ids and feed metadata back to SQLite.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Environment variables.
#
# Public (non-secret) vars can be set here under [vars].
# Secrets MUST be set with `wrangler secret put <NAME>` (never hardcode them):
#
#   TELEGRAM_BOT_TOKEN  -> your bot token from @BotFather
#   ADMIN_USER_ID       -> comma-separated authorized admin user ID(s),
#                          including the userbot trigger account
#   COMMAND_API_SECRET  -> shared secret for the /api/* routes; must match
#                          COMMAND_API_SECRET in tgcloud/lib/config.js
#   DEFAULT_CHAT_ID     -> chat/channel/group to post articles to; defaults to
#                          the first ADMIN_USER_ID
#
# Optionally set these public vars:
#   FETCH_OG_IMAGE      -> set to "false" to DISABLE the webpage og:image fallback
#                          (on by default when a feed provides no image)
#   WORKER_URL          -> this Worker's public URL (e.g.
#                          https://telegram-rss-bot.<subdomain>.workers.dev).
#                          Informational: the Serverless layer calls it.
# ---------------------------------------------------------------------------
[vars]
# Uncomment and set if you want article cards posted to a fixed chat/channel.
# DEFAULT_CHAT_ID = "123456789"
# Disable the webpage image fallback (saves one fetch per image-less article).
# FETCH_OG_IMAGE = "false"
# This Worker's public URL (the Serverless command layer calls it):
WORKER_URL = "https://telegram-rss-bot.reyhaneh-fc0.workers.dev"
