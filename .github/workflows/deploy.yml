name: Deploy RSS Bot

on:
  workflow_dispatch: # manual trigger from the Actions tab
  push:
    branches: [main]

# deploy.sh re-points the Telegram webhook and rewrites the Serverless config,
# so never let two deploys overlap.
concurrency:
  group: deploy-rss-bot
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  deploy:
    # Deploying pushes the Worker, the Telegram Serverless project and re-points
    # the webhook, so it only runs once the tests pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail with the missing names instead of a bare `set -u` abort from
      # deploy.sh, which is how a half-configured repo silently stops deploying.
      - name: Check deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TGCLOUD_TOKEN ADMIN_USER_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          COMMAND_API_SECRET: ${{ secrets.COMMAND_API_SECRET }}
          DEFAULT_CHAT_ID: ${{ secrets.DEFAULT_CHAT_ID }}
        run: ./deploy.sh
