name: Deploy RSS Bot

on:
  workflow_dispatch: # manual trigger from the Actions tab
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  deploy:
    # Deployment pushes the Telegram Serverless project and re-points the
    # webhook, so keep it manual until TGCLOUD_TOKEN is configured in the repo.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          COMMAND_API_SECRET: ${{ secrets.COMMAND_API_SECRET }}
          INTERNAL_POLL_SECRET: ${{ secrets.INTERNAL_POLL_SECRET }}
          DEFAULT_CHAT_ID: ${{ secrets.DEFAULT_CHAT_ID }}
        run: ./deploy.sh
