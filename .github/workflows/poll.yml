name: Poll RSS Feeds

# Telegram Serverless has no cron, so a Telethon userbot sends it /check.
# Running that trigger here keeps the schedule off any local machine.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two triggers at once: the userbot session must not be used
# concurrently, and back-to-back polls would double-send.
concurrency:
  group: rss-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # The trigger waits for the bot's reply (REPLY_TIMEOUT) after sending /check,
    # so this job is no longer a one-second send.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: userbot/requirements.txt

      - name: Check userbot secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          missing=""
          if [ -z "$TG_API_ID" ]; then missing="$missing TG_API_ID"; fi
          if [ -z "$TG_API_HASH" ]; then missing="$missing TG_API_HASH"; fi
          if [ -z "$TG_SESSION_STRING" ]; then missing="$missing TG_SESSION_STRING"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r userbot/requirements.txt

      # The trigger waits for the bot's reply. A refused /check (userbot not an
      # admin), a Worker error, or a webhook that no longer reaches Telegram
      # Serverless now fails this step instead of ending in a green run that
      # silently did nothing — which is how the poller can look healthy while no
      # articles are delivered.
      - name: Send /check and verify the poll
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          # Override with a repository variable if the bot is renamed.
          BOT_USERNAME: ${{ vars.BOT_USERNAME || 'MehranRSSReader_bot' }}
          REPLY_TIMEOUT: "180"
          # Give a slow poll time to finish after its last card before giving up.
          REPLY_SETTLE: "100"
        run: python userbot/trigger.py --once
